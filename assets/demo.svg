<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <title>claude-backup usage demo</title>
  <rect x="0" y="0" width="900" height="480" rx="10" fill="#1e1e1e"/>

  <!-- title bar -->
  <rect x="0" y="0" width="900" height="34" rx="10" fill="#2d2d2d"/>
  <rect x="0" y="20" width="900" height="14" fill="#2d2d2d"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="17" r="6" fill="#27c93f"/>
  <text x="450" y="22" fill="#9a9a9a" font-size="13" text-anchor="middle">zsh — claude-backup</text>

  <g font-size="14.5" fill="#d4d4d4">
    <text x="20" y="64"><tspan fill="#27c93f">$</tspan> <tspan fill="#d4d4d4">./install.sh</tspan></text>
    <text x="20" y="88" fill="#a8a8a8">Installed /Users/you/Library/Scripts/claude-desktop-backup.sh</text>
    <text x="20" y="110" fill="#a8a8a8">Loaded launchd job 'com.local.claude-desktop-backup' (runs daily at 9:00)</text>
    <text x="20" y="132" fill="#a8a8a8">Backups go to: /Users/you/Backups/ClaudeDesktop (keeping 3 snapshots)</text>
    <text x="20" y="154" fill="#a8a8a8">Logs: /Users/you/Library/Logs/claude-desktop-backup.log</text>

    <text x="20" y="196"><tspan fill="#27c93f">$</tspan> <tspan fill="#d4d4d4">ls ~/Backups/ClaudeDesktop/snapshots</tspan></text>
    <text x="20" y="220" fill="#569cd6">2026-08-07  2026-08-08  2026-08-09</text>

    <text x="20" y="262"><tspan fill="#27c93f">$</tspan> <tspan fill="#d4d4d4">tail -3 ~/Library/Logs/claude-desktop-backup.log</tspan></text>
    <text x="20" y="286" fill="#a8a8a8">2026-08-09 09:00:01 pruned /Users/you/Backups/ClaudeDesktop/snapshots/2026-08-06</text>
    <text x="20" y="308" fill="#a8a8a8">2026-08-09 09:00:01 backup complete</text>

    <text x="20" y="350"><tspan fill="#27c93f">$</tspan> <tspan fill="#d4d4d4">shellcheck *.sh</tspan></text>
    <text x="20" y="374" fill="#6a9955"># no output — clean</text>

    <text x="20" y="416"><tspan fill="#27c93f">$</tspan> <tspan fill="#d4d4d4">▍</tspan></text>
  </g>
</svg>
